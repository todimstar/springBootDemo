<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <style>
      .title{font-size:18px;font-weight:700;fill:#1e293b}
      .sub{font-size:12px;fill:#64748b}
      .wlbl{font-size:13px;fill:#475569;font-weight:600}
      .wsub{font-size:10px;fill:#94a3b8}
      .api-m{font-size:11px;font-weight:700;font-family:Consolas,monospace}
      .api-p{font-size:11px;font-family:Consolas,monospace;fill:#334155}
      .api-n{font-size:10px;fill:#64748b}
      .num{font-size:11px;font-weight:700;fill:#fff}
      .lg{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1400" height="920" fill="#fafafa"/>
  <text x="30" y="35" class="title">个人中心 — API 标注图</text>
  <text x="30" y="52" class="sub">基于 PRD V1 · 绿=已实现 黄=部分实现 红=未实现</text>
  <g transform="translate(1100,18)">
    <rect width="12" height="12" rx="2" fill="#22c55e"/><text x="17" y="11" class="lg">已实现</text>
    <rect x="75" width="12" height="12" rx="2" fill="#f59e0b"/><text x="92" y="11" class="lg">部分实现</text>
    <rect x="165" width="12" height="12" rx="2" fill="#ef4444"/><text x="182" y="11" class="lg">未实现</text>
  </g>

  <!-- ===== WIREFRAME ===== -->
  <rect x="30" y="70" width="800" height="810" rx="8" fill="#fff" stroke="#e2e8f0"/>

  <!-- Profile Card -->
  <rect x="60" y="90" width="740" height="160" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="75" y="115" class="wlbl">👤 个人资料卡</text>
  <rect x="75" y="125" width="80" height="80" rx="40" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="115" y="170" text-anchor="middle" class="wsub">头像</text>
  <text x="175" y="145" class="wsub">昵称 · 用户名</text>
  <text x="175" y="162" class="wsub">简介 / Bio</text>
  <text x="175" y="179" class="wsub">地区 · 技术标签(前端/后端/全栈...)</text>
  <text x="175" y="196" class="wsub">帖子数 · 评论数 · 注册时间</text>
  <rect x="650" y="100" width="80" height="30" rx="4" fill="#3b82f6"/><text x="670" y="120" class="wsub" fill="#fff">编辑</text>
  <circle cx="770" cy="110" r="12" fill="#ef4444"/><text x="770" y="114" text-anchor="middle" class="num">1</text>
  <circle cx="700" cy="145" r="12" fill="#22c55e"/><text x="700" y="149" text-anchor="middle" class="num">3</text>

  <!-- Profile Edit Form (modal or inline) -->
  <rect x="60" y="260" width="350" height="120" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-dasharray="4"/>
  <text x="75" y="285" class="wlbl">✏️ 资料编辑 (展开或弹窗)</text>
  <text x="75" y="305" class="wsub">昵称 · 简介 · 地区</text>
  <text x="75" y="320" class="wsub">技术标签 · 性别</text>
  <text x="75" y="340" class="wsub">头像上传</text>
  <circle cx="380" cy="280" r="12" fill="#ef4444"/><text x="380" y="284" text-anchor="middle" class="num">2</text>

  <!-- My Posts Tabs -->
  <rect x="60" y="395" width="740" height="370" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="75" y="420" class="wlbl">📝 我的帖子</text>
  <!-- Tabs -->
  <rect x="75" y="435" width="80" height="28" rx="4" fill="#3b82f6"/><text x="95" y="454" class="wsub" fill="#fff">草稿</text>
  <rect x="165" y="435" width="80" height="28" rx="4" fill="#e2e8f0"/><text x="180" y="454" class="wsub">待审核</text>
  <rect x="255" y="435" width="80" height="28" rx="4" fill="#e2e8f0"/><text x="270" y="454" class="wsub">已发布</text>
  <rect x="345" y="435" width="80" height="28" rx="4" fill="#e2e8f0"/><text x="360" y="454" class="wsub">已拒绝</text>
  <circle cx="770" cy="440" r="12" fill="#f59e0b"/><text x="770" y="444" text-anchor="middle" class="num">4</text>

  <!-- Post items in tab -->
  <rect x="75" y="475" width="700" height="55" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="90" y="500" class="wsub">帖子标题A · 草稿 · 最后编辑: 3天前</text>
  <text x="90" y="515" class="wsub">操作: 编辑 · 发布 · 删除</text>
  <rect x="75" y="540" width="700" height="55" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="90" y="565" class="wsub">帖子标题B · 已发布 · 浏览: 128 评论: 5</text>
  <text x="90" y="580" class="wsub">操作: 编辑 · 删除 · 申请精选</text>
  <rect x="75" y="605" width="700" height="55" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="90" y="630" class="wsub">帖子标题C · 已拒绝 · 原因: 内容不完整</text>
  <text x="90" y="645" class="wsub">操作: 编辑 · 重新发布 · 删除</text>

  <!-- Feature Request Button -->
  <rect x="60" y="780" width="200" height="35" rx="4" fill="#f59e0b" stroke="#d97706"/>
  <text x="80" y="802" class="wlbl" fill="#fff">✨ 申请精选</text>
  <circle cx="235" cy="790" r="12" fill="#ef4444"/><text x="235" y="794" text-anchor="middle" class="num">5</text>

  <!-- Browsing History (V1.1) -->
  <rect x="280" y="780" width="200" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4"/>
  <text x="300" y="802" class="wlbl">📖 浏览历史 (V1.1)</text>

  <!-- ===== API PANEL ===== -->
  <rect x="860" y="70" width="520" height="810" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="885" y="100" font-size="15" font-weight="700" fill="#1e293b">API 端点清单</text>

  <!-- API 1: Get current user ❌ -->
  <g transform="translate(875,115)">
    <rect width="490" height="75" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">1</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">GET</text>
    <text x="80" y="20" class="api-p">/api/users/me</text>
    <text x="42" y="38" class="api-n">❌ 获取当前登录用户信息 — 无此端点</text>
    <text x="42" y="55" class="api-n">现有: UserMapper.findById() 可用, 但无 Controller 路由</text>
    <text x="42" y="68" class="api-n">需要: 从 JWT token 解析 userId → 查询用户信息返回</text>
  </g>

  <!-- API 2: Update profile ❌ -->
  <g transform="translate(875,200)">
    <rect width="490" height="75" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">2</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">PATCH</text>
    <text x="100" y="20" class="api-p">/api/users/me</text>
    <text x="42" y="38" class="api-n">❌ 更新当前用户资料 — 无此端点</text>
    <text x="42" y="55" class="api-n">现有: UserService.updateUser() + UpdateUserDTO 已有</text>
    <text x="42" y="68" class="api-n">需要: 新建 Controller 路由, 绑定当前用户</text>
  </g>

  <!-- API 3: Avatar upload ✅ -->
  <g transform="translate(875,285)">
    <rect width="490" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#22c55e"/><text x="20" y="24" text-anchor="middle" class="num">3</text>
    <text x="42" y="20" class="api-m" fill="#166534">POST</text>
    <text x="90" y="20" class="api-p">/api/auth/upload/userAvatar</text>
    <text x="42" y="38" class="api-n">头像上传 — UserController ✅ 已实现 (MinIO + 压缩)</text>
  </g>

  <!-- API 4: My posts by status ⚠️ -->
  <g transform="translate(875,350)">
    <rect width="490" height="95" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#f59e0b"/><text x="20" y="24" text-anchor="middle" class="num">4</text>
    <text x="42" y="20" class="api-m" fill="#92400e">GET</text>
    <text x="80" y="20" class="api-p">/api/posts/user/{userId}?status=&amp;page=&amp;size=</text>
    <text x="42" y="38" class="api-n">⚠ 用户帖子列表 — 基础分页已有</text>
    <text x="42" y="55" class="api-n" fill="#dc2626">缺少: status 参数过滤 (草稿/待审核/已发布/已拒绝)</text>
    <text x="42" y="72" class="api-n" fill="#dc2626">当前: findPostsByUserId 只区分 isAdmin/isAuthor 身份</text>
    <text x="42" y="87" class="api-n" fill="#dc2626">需要: 增加 status 参数, 作者可看自己所有状态的帖子</text>
  </g>

  <!-- API 5: Feature request ❌ -->
  <g transform="translate(875,455)">
    <rect width="490" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">5</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">POST</text>
    <text x="90" y="20" class="api-p">/api/posts/{id}/feature-request</text>
    <text x="42" y="38" class="api-n">❌ 申请精选 — 无此端点, 无 feature_request 表</text>
  </g>

  <!-- Notes -->
  <g transform="translate(875,525)">
    <rect width="490" height="130" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="22" class="wlbl">📋 个人中心变更需求</text>
    <text x="15" y="42" class="api-n">• 新建 GET /api/users/me 端点 (从JWT解析userId)</text>
    <text x="15" y="58" class="api-n">• 新建 PATCH /api/users/me 端点 (复用UpdateUserDTO)</text>
    <text x="15" y="74" class="api-n">• PostMapper.findPostsByUserId 增加 status 过滤参数</text>
    <text x="15" y="90" class="api-n">• 新建 feature_requests 表 + 全套 CRUD</text>
    <text x="15" y="106" class="api-n">• User 实体考虑增加 techTags 字段 (技术标签)</text>
    <text x="15" y="122" class="api-n">• 帖子被拒绝时需返回 reject_reason</text>
  </g>

  <g transform="translate(875,670)">
    <rect width="490" height="60" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="15" y="22" font-size="13" font-weight="700" fill="#5b21b6">个人中心总结</text>
    <text x="15" y="42" class="api-n">实现度: ~30% · 仅头像上传可用, 其余均需新建</text>
    <text x="15" y="55" class="api-n">联调建议: 需先实现 /users/me, 然后帖子状态过滤, 才可联调</text>
  </g>
</svg>

  <text x="845" y="153" class="annotation">帖子卡片</text>
  <text x="845" y="165" class="annotation">必含: 标题 / 分区</text>
  <text x="845" y="177" class="annotation">摘要 / 作者 / 活跃时间</text>
  <text x="845" y="189" class="annotation">浏览量 / 评论数</text>

  <rect x="912" y="214" width="42" height="24" rx="12" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="924" y="230" class="tag">Git</text>
  <rect x="962" y="214" width="72" height="24" rx="12" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="0.5"/>

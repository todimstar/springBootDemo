  <!-- ==================== ANNOTATIONS PANEL ==================== -->
  <rect x="828" y="590" width="340" height="190" rx="8" fill="none" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="848" y="612" class="annotation" font-weight="bold">设计说明 — A版：现代卡片流</text>
  <text x="848" y="630" class="annotation">1. 顶栏：品牌 + 全局搜索 + 写文章入口</text>
  <text x="848" y="646" class="annotation">2. 分区导航：水平标签页，下划线标识当前分区</text>
  <text x="848" y="662" class="annotation">3. 内容区：Tab(最新/精选/热门) + 卡片列表</text>
  <text x="848" y="678" class="annotation">4. 帖子卡片：大标题 + 摘要 + 元信息 + 可选封面</text>
  <text x="848" y="694" class="annotation">5. 右侧栏：热门标签 / 社区统计 / 活跃作者</text>
  <text x="848" y="710" class="annotation">6. 无限滚动加载（游标分页 feed 接口）</text>
  <text x="848" y="726" class="annotation">7. 大量留白 + 圆角卡片 → 呼吸感 + 现代感</text>
  <text x="848" y="746" class="annotation">布局比例：内容区 68% / 侧栏 32%</text>
  <text x="848" y="762" class="annotation">响应式：&lt;768px 侧栏折叠到顶部标签云</text>

  <!-- Page title -->
  <text x="600" y="790" font-size="10" fill="#ccc" text-anchor="middle">首页 — A版 现代卡片流 | TechHub 轻量技术创作社区 V1</text>
</svg>

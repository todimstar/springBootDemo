  <text x="845" y="217" class="annotation">→ 点击整卡进入详情</text>

  <!-- ===== POST CARD 2 ===== -->
  <rect x="32" y="292" width="780" height="126" rx="8" fill="#fff" stroke="#eee" stroke-width="1"/>
  <rect x="52" y="306" width="64" height="20" rx="10" fill="none" stroke="#aaa" stroke-width="0.8"/>
  <text x="62" y="320" font-size="10" fill="#666">算法与竞赛</text>
  <text x="52" y="344" class="title-lg">力扣周赛 380：从前缀和到单调栈的优雅解法</text>
  <text x="52" y="364" class="body">这道题乍看是个模拟，但换个角度用前缀和+单调栈可以做到 O(n) 复杂度。分享我的</text>
  <text x="52" y="379" class="body">思路演进过程和踩过的坑...</text>
  <circle cx="62" cy="404" r="10" fill="#e0e0e0"/>
  <text x="78" y="408" font-size="11" fill="#444">李四</text>
  <text x="120" y="408" class="meta">昨天</text>
  <text x="174" y="408" class="meta">浏览 856</text>
  <text x="240" y="408" class="meta">评论 42</text>

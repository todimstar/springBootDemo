  <rect x="350" y="396" width="48" height="18" rx="9" fill="#f0f0f0"/>
  <text x="358" y="408" class="tag">单调栈</text>

  <!-- ===== POST CARD 3 ===== -->
  <rect x="32" y="426" width="780" height="126" rx="8" fill="#fff" stroke="#eee" stroke-width="1"/>
  <rect x="52" y="440" width="72" height="20" rx="10" fill="none" stroke="#aaa" stroke-width="0.8"/>
  <text x="60" y="454" font-size="10" fill="#666">AI与工具探索</text>

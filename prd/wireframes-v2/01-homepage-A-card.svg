  <text x="52" y="127" font-size="13" font-weight="bold" fill="#222">最新发布</text>
  <line x1="48" y1="132" x2="100" y2="132" stroke="#333" stroke-width="2"/>
  <text x="120" y="127" font-size="13" fill="#999">精选方案</text>
  <text x="200" y="127" font-size="13" fill="#999">热门</text>
  <text x="260" y="127" class="annotation">← Tab 切换：最新 / 精选 / 热门排序</text>

  <!-- ===== POST CARD 1 ===== -->
  <rect x="32" y="148" width="780" height="136" rx="8" fill="#fff" stroke="#eee" stroke-width="1"/>
  <!-- Cover image placeholder (optional) -->
  <rect x="636" y="162" width="160" height="108" rx="6" fill="#eee" stroke="#ddd" stroke-width="0.5"/>
  <text x="688" y="220" font-size="11" fill="#bbb">封面图</text>
  <text x="688" y="234" font-size="9" fill="#ccc">(可选)</text>
  <!-- Category badge -->
  <rect x="52" y="162" width="88" height="20" rx="10" fill="none" stroke="#aaa" stroke-width="0.8"/>
  <text x="64" y="176" font-size="10" fill="#666">后端与开发实践</text>
  <!-- Title -->
  <text x="52" y="202" class="title-lg">Spring Boot 3.x 集成 Redis 实现分布式缓存最佳实践</text>
  <!-- Summary -->
  <text x="52" y="222" class="body">本文详细介绍了 Spring Boot 3.x 中如何集成 Redis，包括连接池配置、序列化方案选择、</text>
  <text x="52" y="237" class="body">缓存注解使用以及集群部署方案，附带完整可运行示例代码...</text>
  <!-- Author + Meta -->
  <circle cx="62" cy="264" r="10" fill="#e0e0e0"/>
  <text x="78" y="268" font-size="11" fill="#444">张三</text>
  <text x="120" y="268" class="meta">3小时前活跃</text>
  <text x="210" y="268" class="meta">浏览 1.2k</text>
  <text x="278" y="268" class="meta">评论 23</text>
  <!-- Tags -->
  <rect x="340" y="256" width="48" height="18" rx="9" fill="#f0f0f0"/>
  <text x="350" y="268" class="tag">Spring</text>
  <rect x="396" y="256" width="42" height="18" rx="9" fill="#f0f0f0"/>
  <text x="406" y="268" class="tag">Redis</text>
  <rect x="446" y="256" width="42" height="18" rx="9" fill="#f0f0f0"/>
  <text x="456" y="268" class="tag">Java</text>

  <!-- Card annotation -->

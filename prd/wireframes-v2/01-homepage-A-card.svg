  <text x="244" y="542" class="meta">评论 89</text>
  <text x="186" y="454" class="annotation">← 精选标记</text>

  <!-- ===== POST CARD 4 (partial, indicating scroll) ===== -->
  <rect x="32" y="560" width="780" height="70" rx="8" fill="#fff" stroke="#eee" stroke-width="1"/>
  <rect x="52" y="574" width="88" height="20" rx="10" fill="none" stroke="#aaa" stroke-width="0.8"/>
  <text x="58" y="588" font-size="10" fill="#666">解决方案与踩坑</text>
  <text x="52" y="612" class="title-lg">MySQL 8.0 死锁排查全记录：从 binlog 到 MVCC</text>
  <!-- Fade out effect -->
  <rect x="32" y="610" width="780" height="20" rx="0" fill="url(#fadeOut)"/>
  <defs>
    <linearGradient id="fadeOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5f5f5" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Infinite scroll hint -->
  <text x="370" y="650" font-size="11" fill="#999">↓ 无限滚动加载更多 (游标分页) ↓</text>
  <text x="348" y="666" class="annotation">使用 /api/posts/feed 游标分页接口，高性能无限滚动</text>


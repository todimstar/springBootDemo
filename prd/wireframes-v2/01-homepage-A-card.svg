<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
      .annotation { font-size: 9px; fill: #c0392b; font-style: italic; }
      .title-lg { font-size: 18px; font-weight: bold; fill: #111; }
      .title-md { font-size: 14px; font-weight: bold; fill: #222; }
      .title-sm { font-size: 12px; font-weight: 600; fill: #333; }
      .body { font-size: 12px; fill: #666; }
      .meta { font-size: 10px; fill: #999; }
      .label { font-size: 10px; fill: #555; }
      .btn-text { font-size: 12px; fill: #fff; }
      .section-title { font-size: 13px; font-weight: bold; fill: #333; }
      .tag { font-size: 10px; fill: #555; }
    </style>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1200" height="800" fill="#f5f5f5"/>

  <!-- ==================== TOP NAV BAR ==================== -->
  <rect width="1200" height="52" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Logo -->
  <rect x="40" y="12" width="28" height="28" rx="6" fill="#333"/>
  <text x="42" y="31" font-size="14" font-weight="bold" fill="#fff">T</text>
  <text x="76" y="33" class="title-md">TechHub</text>
  <!-- Search -->
  <rect x="220" y="11" width="340" height="30" rx="15" fill="none" stroke="#d5d5d5" stroke-width="1.2"/>
  <text x="244" y="31" font-size="12" fill="#bbb">搜索帖子、标签、作者...</text>
  <circle cx="538" cy="26" r="7" fill="none" stroke="#aaa" stroke-width="1.2"/>
  <line x1="543" y1="31" x2="549" y2="37" stroke="#aaa" stroke-width="1.2"/>
  <!-- Write button -->
  <rect x="880" y="11" width="84" height="30" rx="15" fill="#333"/>
  <text x="894" y="31" class="btn-text">+ 写文章</text>
  <!-- Notification -->
  <rect x="984" y="14" width="24" height="24" rx="5" fill="none" stroke="#999" stroke-width="1"/>
  <circle cx="996" cy="22" r="6" fill="none" stroke="#999" stroke-width="1"/>
  <line x1="996" y1="16" x2="996" y2="18" stroke="#999" stroke-width="1"/>
  <!-- Avatar (logged in) -->
  <circle cx="1044" cy="26" r="15" fill="#ddd" stroke="#ccc" stroke-width="1"/>
  <text x="1036" y="30" font-size="9" fill="#999">头像</text>
  <text x="1068" y="24" font-size="10" fill="#666">username</text>
  <line x1="1110" y1="24" x2="1116" y2="28" stroke="#666" stroke-width="1"/>
  <line x1="1116" y1="28" x2="1122" y2="24" stroke="#666" stroke-width="1"/>

  <!-- Login state annotations -->
  <rect x="1060" y="38" width="130" height="30" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="2,2" rx="3"/>
  <text x="1066" y="50" class="annotation">未登录时显示:</text>
  <text x="1066" y="62" class="annotation">[登录] [注册] 按钮</text>

  <!-- ==================== CATEGORY NAVIGATION ==================== -->
  <rect y="52" width="1200" height="40" fill="#fff" stroke="#e8e8e8" stroke-width="0.5"/>
  <text x="48" y="77" font-size="12" font-weight="bold" fill="#111">全部</text>
  <line x1="42" y1="82" x2="66" y2="82" stroke="#333" stroke-width="2"/>
  <text x="90" y="77" font-size="12" fill="#666">后端与开发实践</text>
  <text x="196" y="77" font-size="12" fill="#666">算法与竞赛</text>
  <text x="280" y="77" font-size="12" fill="#666">AI与工具探索</text>
  <text x="374" y="77" font-size="12" fill="#666">解决方案与踩坑</text>
  <text x="480" y="77" font-size="12" fill="#666">工具与资源</text>
  <text x="564" y="77" font-size="12" fill="#666">茶水间</text>

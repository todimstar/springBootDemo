<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <style>
      .title{font-size:18px;font-weight:700;fill:#1e293b}
      .sub{font-size:12px;fill:#64748b}
      .wlbl{font-size:13px;fill:#475569;font-weight:600}
      .wsub{font-size:10px;fill:#94a3b8}
      .api-m{font-size:11px;font-weight:700;font-family:Consolas,monospace}
      .api-p{font-size:11px;font-family:Consolas,monospace;fill:#334155}
      .api-n{font-size:10px;fill:#64748b}
      .num{font-size:11px;font-weight:700;fill:#fff}
      .lg{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1400" height="920" fill="#fafafa"/>
  <!-- Title -->
  <text x="30" y="35" class="title">首页 (D-blog版) — API 标注图</text>
  <text x="30" y="52" class="sub">基于 PRD V1 · 绿=已实现 黄=部分实现 红=未实现</text>
  <!-- Legend -->
  <g transform="translate(1100,18)">
    <rect width="12" height="12" rx="2" fill="#22c55e"/><text x="17" y="11" class="lg">已实现</text>
    <rect x="75" width="12" height="12" rx="2" fill="#f59e0b"/><text x="92" y="11" class="lg">部分实现</text>
    <rect x="165" width="12" height="12" rx="2" fill="#ef4444"/><text x="182" y="11" class="lg">未实现</text>
  </g>

  <!-- ===== WIREFRAME ===== -->
  <!-- Header -->
  <rect x="30" y="70" width="800" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="50" y="100" class="wlbl">Logo · 导航 · 搜索框</text>
  <circle cx="770" cy="95" r="12" fill="#ef4444"/><text x="770" y="99" text-anchor="middle" class="num">5</text>

  <!-- Category Sidebar -->
  <rect x="30" y="130" width="170" height="620" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="50" y="155" class="wlbl">分区导航</text>
  <text x="50" y="175" class="wsub">全部 · 前端 · 后端</text>
  <text x="50" y="190" class="wsub">移动端 · DevOps</text>
  <circle cx="170" cy="145" r="12" fill="#22c55e"/><text x="170" y="149" text-anchor="middle" class="num">1</text>

  <!-- Hero Card -->
  <rect x="210" y="130" width="430" height="180" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="230" y="160" class="wlbl">精选 Hero 卡片</text>
  <text x="230" y="180" class="wsub">featured 帖子标题</text>
  <text x="230" y="195" class="wsub">作者 · 分区 · 标签 · 摘要</text>
  <text x="230" y="210" class="wsub">viewCount · commentCount</text>
  <circle cx="610" cy="150" r="12" fill="#ef4444"/><text x="610" y="154" text-anchor="middle" class="num">4</text>

  <!-- Post List -->
  <rect x="210" y="320" width="430" height="430" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="230" y="345" class="wlbl">帖子列表</text>
  <!-- Post items -->
  <rect x="225" y="360" width="400" height="70" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="240" y="385" class="wsub">标题 · 摘要(≤300字)</text>
  <text x="240" y="400" class="wsub">作者头像+昵称 · 分区 · 标签 · 时间</text>
  <text x="240" y="415" class="wsub">浏览量 · 评论数</text>
  <rect x="225" y="440" width="400" height="70" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="240" y="465" class="wsub">帖子条目 2...</text>
  <rect x="225" y="520" width="400" height="70" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="240" y="545" class="wsub">帖子条目 3...</text>
  <rect x="225" y="600" width="400" height="70" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <text x="240" y="625" class="wsub">帖子条目 4...</text>
  <text x="340" y="725" class="wsub">分页 / 游标加载更多</text>
  <circle cx="610" cy="340" r="12" fill="#f59e0b"/><text x="610" y="344" text-anchor="middle" class="num">2</text>

  <!-- Right Sidebar -->
  <rect x="650" y="130" width="180" height="200" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="670" y="155" class="wlbl">🏷 热门标签</text>
  <text x="670" y="175" class="wsub">Spring Boot · React</text>
  <text x="670" y="190" class="wsub">Docker · Vue.js</text>
  <text x="670" y="205" class="wsub">TypeScript · Redis</text>
  <circle cx="800" cy="145" r="12" fill="#ef4444"/><text x="800" y="149" text-anchor="middle" class="num">3</text>

  <rect x="650" y="340" width="180" height="120" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="670" y="365" class="wlbl">社区统计</text>
  <text x="670" y="385" class="wsub">帖子总数 · 用户总数</text>
  <text x="670" y="400" class="wsub">今日新帖</text>

  <rect x="650" y="470" width="180" height="120" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="670" y="495" class="wlbl">活跃作者</text>
  <text x="670" y="515" class="wsub">头像 · 昵称 · 帖子数</text>

  <!-- ===== API PANEL ===== -->
  <rect x="860" y="70" width="520" height="790" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="885" y="100" class="title" font-size="15">API 端点清单</text>

  <!-- API 1: Categories ✅ -->
  <g transform="translate(875,115)">
    <rect width="490" height="55" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#22c55e"/><text x="20" y="24" text-anchor="middle" class="num">1</text>
    <text x="42" y="20" class="api-m" fill="#166534">GET</text>
    <text x="80" y="20" class="api-p">/api/categories</text>
    <text x="42" y="38" class="api-n">分区列表 — CategoryController ✅ 已实现</text>
  </g>

  <!-- API 2: Posts List ⚠️ -->
  <g transform="translate(875,180)">
    <rect width="490" height="75" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#f59e0b"/><text x="20" y="24" text-anchor="middle" class="num">2</text>
    <text x="42" y="20" class="api-m" fill="#92400e">GET</text>
    <text x="80" y="20" class="api-p">/api/posts?page=&amp;size=&amp;categoryId=&amp;tagId=</text>
    <text x="42" y="38" class="api-n">帖子列表 — 基础分页 ✅ 已有</text>
    <text x="42" y="53" class="api-n" fill="#dc2626">⚠ 缺少: categoryId/tagId 过滤, last_activity_time 排序</text>
    <text x="42" y="68" class="api-n" fill="#dc2626">⚠ /api/posts/feed 游标分页已有但也缺过滤</text>
  </g>

  <!-- API 3: Hot Tags ❌ -->
  <g transform="translate(875,265)">
    <rect width="490" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">3</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">GET</text>
    <text x="80" y="20" class="api-p">/api/tags/hot</text>
    <text x="42" y="38" class="api-n">热门标签 — ❌ 标签系统完全未实现 (无 Entity/Mapper/Service/Controller)</text>
  </g>

  <!-- API 4: Featured ❌ -->
  <g transform="translate(875,330)">
    <rect width="490" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">4</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">GET</text>
    <text x="80" y="20" class="api-p">/api/posts?featured=true</text>
    <text x="42" y="38" class="api-n">精选帖子 — ❌ Post 无 is_featured 字段, 无精选筛选</text>
  </g>

  <!-- API 5: Search ❌ -->
  <g transform="translate(875,395)">
    <rect width="490" height="55" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="12" fill="#ef4444"/><text x="20" y="24" text-anchor="middle" class="num">5</text>
    <text x="42" y="20" class="api-m" fill="#991b1b">GET</text>
    <text x="80" y="20" class="api-p">/api/posts/search?q=</text>
    <text x="42" y="38" class="api-n">搜索 — ❌ 无搜索接口 (V1 可降级或延后)</text>
  </g>

  <!-- DB Notes -->
  <g transform="translate(875,470)">
    <rect width="490" height="120" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="22" class="wlbl">📋 首页数据库变更需求</text>
    <text x="15" y="42" class="api-n">• posts 表需增加 last_activity_time DATETIME (排序字段)</text>
    <text x="15" y="58" class="api-n">• posts 表需增加 is_featured BOOLEAN (精选标记)</text>
    <text x="15" y="74" class="api-n">• 新建 tags 表 (id, name, slug, use_count)</text>
    <text x="15" y="90" class="api-n">• 新建 post_tags 表 (post_id, tag_id) 多对多</text>
    <text x="15" y="106" class="api-n">• PostSummaryVO 需增加 tagList 字段</text>
  </g>

  <!-- Summary -->
  <g transform="translate(875,605)">
    <rect width="490" height="80" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="15" y="22" font-size="13" font-weight="700" fill="#5b21b6">首页总结</text>
    <text x="15" y="42" class="api-n">实现度: ~50% · 基础帖子列表和分区可用</text>
    <text x="15" y="58" class="api-n">核心缺失: 标签系统、分区筛选、活跃排序、精选标记</text>
    <text x="15" y="72" class="api-n">联调建议: 可先联调分区+帖子列表, 标签/精选/搜索后续迭代</text>
  </g>
</svg>

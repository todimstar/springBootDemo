  <rect x="264" y="350" width="36" height="18" rx="9" fill="#f5f5f5"/>
  <text x="272" y="363" font-size="9" fill="#999">草稿</text>
  <text x="264" y="386" font-size="14" font-weight="bold" fill="#111">Docker Compose 多容器编排实战（未完成）</text>

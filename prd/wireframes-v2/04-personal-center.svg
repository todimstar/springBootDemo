  <text x="276" y="587" font-size="10" fill="#c62828">拒绝原因：内容涉及版权问题，建议修改后重新提交</text>
  <text x="980" y="540" font-size="10" fill="#666">编辑</text>
  <text x="1020" y="540" font-size="10" fill="#2e7d32">重新发布</text>
  <text x="1094" y="540" font-size="10" fill="#e74c3c">删除</text>
  <line x1="264" y1="594" x2="1132" y2="594" stroke="#f5f5f5" stroke-width="0.5"/>

  <!-- ===== Post Row 5 (partial) ===== -->
  <rect x="248" y="602" width="900" height="50" rx="0" fill="#fff"/>
  <rect x="264" y="612" width="48" height="18" rx="9" fill="#e8f5e9"/>
  <text x="272" y="625" font-size="9" fill="#2e7d32">已发布</text>
  <text x="264" y="644" font-size="14" font-weight="bold" fill="#111">力扣周赛 380 解题思路分享...</text>

  <!-- Fade -->
  <defs>
    <linearGradient id="fade3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5f5f5" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="248" y="640" width="900" height="40" fill="url(#fade3)"/>

  <!-- Pagination -->
  <text x="700" y="680" class="meta" text-anchor="middle">共 28 篇 · 每页 10 篇 · 第 1/3 页</text>
  <text x="700" y="696" class="ann">GET /api/posts/user/{userId} 分页</text>

  <!-- ==================== ANNOTATIONS ==================== -->
  <rect x="248" y="710" width="900" height="56" rx="6" fill="none" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="264" y="730" class="ann" font-weight="bold">个人中心设计说明</text>
  <text x="264" y="744" class="ann">定位：创作管理台，核心是帖子管理。状态 Tab 精准对应后端 status 枚举(0-3)。每行操作按钮按权限矩阵动态显隐。</text>
  <text x="264" y="758" class="ann">已拒绝帖子显示拒绝原因，引导作者修改后重新发布。个人资料统计区展示创作成就。编辑资料使用弹窗模式，减少页面跳转。</text>

  <text x="600" y="790" font-size="10" fill="#ccc" text-anchor="middle">个人中心（创作管理台） | TechHub 轻量技术创作社区 V1</text>
</svg>

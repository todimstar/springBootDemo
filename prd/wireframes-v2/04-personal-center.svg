  <text x="106" y="128" font-size="14" fill="#999">头像</text>
  <!-- User info -->
  <text x="180" y="96" font-size="20" font-weight="bold" fill="#111">张三</text>
  <rect x="248" y="80" width="72" height="22" rx="11" fill="#f0f0f0"/>
  <text x="260" y="95" font-size="10" fill="#666">Lv.3 活跃</text>
  <text x="180" y="118" font-size="12" fill="#666">Java 后端开发 · 热爱开源 · 坐标深圳</text>
  <text x="180" y="138" class="meta">注册于 2024-01-15 · 最后活跃 3小时前</text>
  <!-- Stats -->
  <text x="600" y="96" class="stat-num">28</text>
  <text x="600" y="114" class="stat-label">帖子</text>
  <text x="700" y="96" class="stat-num">1.2k</text>
  <text x="700" y="114" class="stat-label">获赞</text>
  <text x="800" y="96" class="stat-num">456</text>
  <text x="800" y="114" class="stat-label">被收藏</text>
  <text x="900" y="96" class="stat-num">89</text>
  <text x="900" y="114" class="stat-label">粉丝</text>
  <text x="1000" y="96" class="stat-num">23</text>
  <text x="1000" y="114" class="stat-label">关注</text>

version: '3.8'

services:

  # MySQL 数据库 (AI开发专用，用生产SQL初始化)
  mysql:
    image: mysql:8.0
    container_name: community-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT}:3306"   # 由 .env 统一控制对外端口
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d  # 自动执行初始化SQL
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --init-connect="SET NAMES utf8mb4" #让非root用户登录时将剩下三个charcater_set也统一
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:6.2.6-alpine
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z # 全功能版本
    container_name: community-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-123456789}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # API 端口
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # 控制台端口
    volumes:
      - ./minio/data:/data        # 数据持久化（重要！）
      - ./minio/config:/root/.minio
      - ./minio/logs:/var/log/minio
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: community-network
